# ============================================================
#  AQIssue  ——  游戏内一键向 GitHub 仓库提交 Issue
#  基于 Paper Dialog API，兼容 Paper 1.21.7 ~ 最新版
#
#  本文件只放「功能配置」。
#  所有给玩家看的文字都在 lang.yml 里，改文案不用动这个文件。
# ============================================================

# ------------------------------------------------------------
# 语言文件
# ------------------------------------------------------------
# 默认 lang.yml（简体中文）。想换文案改 lang.yml；
# 想加别的语言就复制一份成 lang_en.yml 再改这里。
language-file: "lang.yml"

# ------------------------------------------------------------
# GitHub 仓库与凭据
# ------------------------------------------------------------
github:
  # GitHub REST API 地址，自建 GitHub Enterprise 时改成 https://git.example.com/api/v3
  api-base: "https://api.github.com"

  # 目标仓库（owner/repo）
  owner: "MCQingYu-Team"
  repo: "AQ-Iusse"

  # 自动附加到新 Issue 上的标签（标签必须已存在于仓库中，否则会被 GitHub 忽略）
  labels:
    - "游戏内反馈"

  # 标题前缀，便于在仓库里一眼区分来源
  title-prefix: "[游戏内] "

  # 是否在 Issue 正文中附加玩家与服务器信息
  include-player-info: true
  include-server-info: true

  # 网络超时（毫秒）
  timeout-millis: 10000

  # 代理（国内服务器访问 api.github.com 不稳定时可打开）
  proxy:
    enabled: false
    host: "127.0.0.1"
    port: 7890

# ------------------------------------------------------------
# 投递渠道（可同时开启，玩家一次提交会发往所有已启用的渠道）
# ------------------------------------------------------------
channels:
  # GitHub Issue。默认用 GitHub App：身份是机器人，token 一小时自动轮换、永不过期，
  # 不需要像 PAT 那样定期手动更换。
  github:
    enabled: true
    # app   = 机器人身份（推荐）
    # token = 应急用的 PAT，一般用不到
    auth-type: "app"

    # 创建步骤：
    #   1) 打开 https://github.com/settings/apps → New GitHub App
    #   2) 取消勾选 Webhook，权限只给 Repository permissions → Issues: Read and write
    #   3) 创建后点 Install App，安装到目标仓库
    #   4) 安装完成后地址栏里的数字就是 installation-id
    app-id: ""
    installation-id: ""

    # App 页面下载的 .pem 私钥放到 plugins/AQIssue/ 下，这里填文件名
    # （PKCS#1 与 PKCS#8 两种格式都支持，不需要 openssl 转换）
    private-key-file: "github-app.pem"
    # 也可以不落盘，直接把 PEM 内容粘在这里；两处只填一个
    private-key: ""

    # auth-type: token 时才用
    token: ""

  # Discord 频道 Webhook（不需要机器人常驻）
  discord:
    enabled: false
    # 频道设置 → 整合 → Webhook → 新建 Webhook → 复制 Webhook URL
    webhook-url: ""
    username: "服务器反馈"
    # 左侧色条的十进制颜色
    embed-color: 5793266

  # OneBot（QQ），采用反向 WebSocket：插件监听端口，NapCat 主动连过来
  onebot:
    enabled: false
    # 绑定网卡。NapCat 与服务器同机时保持 127.0.0.1 即可
    bind: "127.0.0.1"
    port: 6700
    path: "/onebot"
    # 与 NapCat 反向 WS 的 token 保持一致，留空表示不校验
    access-token: ""
    # 要发到哪些群（QQ 群号）
    group-ids: []
    timeout-millis: 8000

# ------------------------------------------------------------
# 提交限制
# ------------------------------------------------------------
submit:
  # 同一玩家的提交冷却时间（秒），0 表示不限制
  cooldown-seconds: 300
  # 标题长度限制（对话框直接限制输入长度）
  min-title-length: 4
  max-title-length: 60
  # 正文最大长度
  max-body-length: 800

# ------------------------------------------------------------
# 反馈分类（对话框里「反馈分类」下拉框的选项）
# ------------------------------------------------------------
# id        用于 /iusse submit <id> ...，也是写入 GitHub 的标签来源
# name      下拉框中显示的名字
# description 一句话说明，会拼在名字后面展示
# labels    该分类额外附加的 GitHub 标签
categories:
  - id: "bug"
    name: "Bug 反馈"
    description: "报错、闪退、功能异常、卡顿"
    labels: ["bug"]

  - id: "feature"
    name: "功能建议"
    description: "希望服务器新增或优化的内容"
    labels: ["enhancement"]

  - id: "report"
    name: "举报投诉"
    description: "违规行为、玩家纠纷、管理投诉"
    labels: ["report"]

  - id: "other"
    name: "其它问题"
    description: "不属于以上分类的内容"
    labels: ["question"]


