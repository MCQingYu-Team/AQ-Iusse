# ============================================================
#  AQIssue  ——  游戏内一键向 GitHub 仓库提交 Issue
#  基于 Paper Dialog API，兼容 Paper 1.21.7 ~ 最新版
#
#  本文件只放「功能配置」。
#  所有给玩家看的文字都在 lang.yml 里，改文案不用动这个文件。
# ============================================================

# ------------------------------------------------------------
# 语言文件
# ------------------------------------------------------------
# 默认 lang.yml（简体中文）。想换文案改 lang.yml；
# 想加别的语言就复制一份成 lang_en.yml 再改这里。
language-file: "lang.yml"

# ------------------------------------------------------------
# GitHub 仓库与凭据
# ------------------------------------------------------------
github:
  # GitHub REST API 地址，自建 GitHub Enterprise 时改成 https://git.example.com/api/v3
  api-base: "https://api.github.com"

  # 目标仓库（owner/repo）
  owner: "MCQingYu-Team"
  repo: "AQ-Iusse"

  # 自动附加到新 Issue 上的标签（标签必须已存在于仓库中，否则会被 GitHub 忽略）
  labels:
    - "游戏内反馈"

  # 标题前缀，便于在仓库里一眼区分来源
  title-prefix: "[游戏内] "

  # 是否在 Issue 正文中附加玩家与服务器信息
  include-player-info: true
  include-server-info: true

  # Issue 正文用富文本排版：顶部一句提示、一张信息表、正文单独成段、
  # 技术信息（UUID / 服务端版本）收进折叠块
  # false 则退化成简单的项目符号列表
  rich-body: true

  # 网络超时（毫秒）
  timeout-millis: 10000

  # 请求失败时的重试次数（不含首次）。只对网络异常、429 与 5xx 生效；
  # 401 / 404 这类「配置本身有问题」的错误重试多少次都没用，不会重试。
  retry: 2

  # 代理（国内服务器访问 api.github.com 不稳定时可打开）
  proxy:
    enabled: false
    host: "127.0.0.1"
    port: 7890

# ------------------------------------------------------------
# 投递渠道（可同时开启，玩家一次提交会发往所有已启用的渠道）
# ------------------------------------------------------------
channels:
  # GitHub Issue：用一个 Fine-grained PAT 提交，只需要目标仓库的 Issues 读写权限。
  github:
    enabled: true

    # 创建步骤（约 1 分钟）：
    #   1) 打开 https://github.com/settings/personal-access-tokens → Fine-grained tokens
    #   2) Repository access 选 Only select repositories，勾上目标仓库
    #   3) Permissions → Repository permissions → Issues 设为 Read and write
    #      （Account permissions 一个都不用勾）
    #   4) 生成后把 github_pat_... 粘到下面
    token: ""

  # Discord 频道 Webhook（不需要机器人常驻）
  discord:
    enabled: false
    # 频道设置 → 整合 → Webhook → 新建 Webhook → 复制 Webhook URL
    webhook-url: ""
    username: "服务器反馈"
    # 左侧色条的十进制颜色
    embed-color: 5793266

  # OneBot（QQ）。两种接法二选一：
  #   server = 插件监听端口，NapCat 主动连过来（反向 WS）
  #   client = 插件主动连 NapCat 的「WebSocket 服务端」（正向 WS），
  #            适用于插件所在机器不能被 NapCat 访问、但 NapCat 那台有公网端口映射的情况
  onebot:
    enabled: false
    mode: "server"

    # mode: server 时生效 —— 插件监听的网卡与端口
    # bind 用 127.0.0.1 仅限 NapCat 与服务器同机；跨机请改 0.0.0.0 并放行端口
    bind: "127.0.0.1"
    port: 6700
    path: "/onebot"

    # mode: client 时生效 —— 要连接的 NapCat 地址
    url: "ws://example.com:8082"

    # 与 NapCat 侧的 token 保持一致，留空表示不校验
    access-token: ""
    # 要发到哪些群（QQ 群号）
    group-ids: []
    # 要私聊给哪些 QQ 号（一般是管理员），可填多个；群与私聊会同时发送
    private-ids: []
    timeout-millis: 8000

    # 群里发反馈时 @ 提交者（需要 EasyBot 能查到他的 QQ；查不到就不 @）
    mention-player: true
    # 群里发反馈时顺带把提交者的 QQ 号写在消息里
    show-player-qq: true

# ------------------------------------------------------------
# 反馈跟踪（GitHub Issue 状态回传 + 处理超时提醒）
# ------------------------------------------------------------
# 需要 GitHub 渠道可用（PAT）才能查询 Issue 状态，否则本段自动跳过。
tracking:
  enabled: true
  # 轮询间隔（分钟）
  interval-minutes: 10
  # 每轮最多查询多少个 Issue，用来控制 API 用量
  max-per-run: 10
  # 只跟踪最近多少天内提交的反馈
  keep-days: 30
  # Issue 被关闭时通知当初提交的玩家
  notify-on-close: true
  # Issue 有新评论时通知当初提交的玩家
  notify-on-comment: true
  # Issue 处理完成（被关闭）时，是否也在渠道里播报一条（QQ 群 / Discord）
  announce-on-close: true
  # 玩家离线时把通知存起来，等他上线补发（false 则直接丢弃）
  queue-offline: true
  # 玩家离线时，经 EasyBot 查询其绑定的 QQ 并私信通知（需要服务器装了 EasyBot）
  notify-qq-offline: true

  # GitHub API 剩余额度低于该值时自动降低轮询频率（把间隔临时放大 6 倍），
  # 额度恢复后自动还原。0 表示不降频。
  rate-limit-threshold: 100

  # 处理超时提醒（SLA）
  sla:
    enabled: true
    # 超过多少小时仍未关闭就提醒管理员
    hours: 48
    # 同一个 Issue 的重复提醒间隔（小时）
    repeat-hours: 72
    # 除控制台外，是否也发到已启用的渠道（QQ 群 / Discord）
    broadcast: true
    # 超时提醒是否发到 QQ 群
    notify-groups: false
    # 超时提醒是否私信给上面的 private-ids（private-ids 为空时请把 notify-groups 打开）
    notify-private: true

# ------------------------------------------------------------
# 提交限制
# ------------------------------------------------------------
submit:
  # 同一玩家的提交冷却时间（秒），0 表示不限制
  cooldown-seconds: 300
  # 拥有该权限的玩家不受提交限制（冷却 + 长度校验），留空表示不启用
  bypass-permission: "aqissue.admin"
  # 标题长度限制（对话框直接限制输入长度）
  min-title-length: 4
  max-title-length: 60
  # 正文最大长度
  max-body-length: 800
  # /iusse reply 单条回复的最大长度
  max-reply-length: 300

  # 提交前先在已有的未关闭反馈里找相似的，命中时先弹一个确认框，
  # 减少「同一个问题被提十遍」。需要 GitHub 渠道可用。
  duplicate-check: true
  # 判定为疑似重复的相似度阈值（0.1 ~ 1.0，越大越严格）
  duplicate-threshold: 0.6

  # 自动给正文里的 IP / QQ / 手机号 / 邮箱打码（反馈通常落在公开仓库里）。
  # 单个分类可以用 mask: false 单独关掉，见下面 categories 段。
  mask-sensitive: true

  # 所有渠道都投递失败时（多半是网络抖动），把这条反馈存盘等待自动重发
  retry-queue: true
  # 重试的检查间隔（分钟）
  retry-interval-minutes: 10
  # 同一条反馈最多重试几次，超过就放弃并告知玩家
  retry-max-attempts: 5
  # 反馈在重发队列里最多保留多少小时
  retry-keep-hours: 72

# ------------------------------------------------------------
# 对话框外观
# ------------------------------------------------------------
dialog:
  # true：两步式 —— 先点分类按钮（鼠标悬停有说明），再填标题与内容，
  #       可点「返回」改分类；比一个下拉框塞满所有东西更好看也好用
  # false：单页式 —— 下拉框 + 标题 + 正文
  # 分类超过 8 个时会自动退回单页式，免得按钮挤成一团
  two-step: true

  # 对话框正文区是否带一个物品图标（书与笔）
  show-icon: true

# ------------------------------------------------------------
# 反馈分类（对话框里「反馈分类」下拉框的选项）
# ------------------------------------------------------------
# id          用于 /iusse submit <id> ...，也是写入 GitHub 的标签来源
# name        下拉框中显示的名字
# description 一句话说明，会拼在名字后面展示
# labels      该分类额外附加的 GitHub 标签（同样需要仓库里已存在）
# mask        该分类是否参与隐私打码，默认 true；举报投诉要保留 QQ 号，所以关掉
# 建议不超过 8 个：对话框第一页每个分类占一个按钮，超过 8 个会退回下拉框式
# 注意：labels 里的标签必须已经在仓库里创建好，否则 GitHub 会静默忽略（不会报错）
#       用 /iusse test 可以查出仓库里缺哪些标签
categories:
  - id: "bug"
    name: "Bug 反馈"
    description: "报错、闪退、功能异常"
    labels: ["bug"]

  - id: "crash"
    name: "崩溃卡死"
    description: "服务端或客户端崩溃、卡死不动"
    labels: ["bug", "crash"]

  - id: "lag"
    name: "卡顿掉帧"
    description: "TPS 低、延迟高、画面卡"
    labels: ["performance"]

  - id: "feature"
    name: "功能建议"
    description: "希望服务器新增或优化的内容"
    labels: ["enhancement"]

  - id: "report"
    name: "举报投诉"
    description: "违规行为、玩家纠纷、管理投诉"
    labels: ["report"]
    # 举报内容里的 QQ 号是必要证据，不打码
    mask: false

  - id: "appeal"
    name: "封禁申诉"
    description: "对处罚有异议，申请复核"
    labels: ["appeal"]

  - id: "account"
    name: "账号问题"
    description: "登录、绑定、改名、数据丢失"
    labels: ["account"]

  - id: "other"
    name: "其它问题"
    description: "不属于以上分类的内容"
    labels: ["question"]


