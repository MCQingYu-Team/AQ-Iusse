# ============================================================
#  AQIssue 语言文件 (lang.yml)
# ------------------------------------------------------------
#  插件里所有给玩家看的文本都在这一个文件里，改文案 / 做汉化
#  只需要动这里，不用碰 config.yml。
#
#  · 支持 & 颜色代码，例如 &c 红色、&l 加粗
#  · {xxx} 是占位符，由插件在运行时替换，请勿删掉
#  · 想用其它语言时，复制本文件改成 lang_en.yml，
#    再把 config.yml 里的 language-file 指过去即可
# ============================================================

meta:
  locale: "zh_CN"
  name: "简体中文"

# 所有消息的公共前缀
prefix: "&8[&bAQIssue&8] &r"

# ------------------------------------------------------------
# 通用提示
# ------------------------------------------------------------
general:
  no-permission: "&c你没有权限执行该操作。"
  player-only: "&c该指令只能由玩家执行。"
  reloaded: "&a配置与语言文件已重载。"
  unknown-category: "&c未知的分类：&f{id}"
  repo-not-configured: "&c服务器尚未配置目标仓库，请联系管理员。"
  no-token: "&cGitHub 渠道已启用但未配置 PAT，请联系管理员。"
  github-unavailable: "&cGitHub 渠道当前不可用（需启用并配置 PAT），该功能暂时无法使用。"

# ------------------------------------------------------------
# 对话框（Paper Dialog API）
# ------------------------------------------------------------
# 对话框里的文字以原版界面样式渲染，这里写纯文本，不需要颜色代码。
dialog:
  # ---- 第一步：选分类（两步式） ----
  picker-title: "提交反馈"
  picker-body: "选择要提交的反馈类型。"
  picker-hint: "写清楚「什么时间、在哪个世界、做了什么、报了什么错」，处理起来会快很多。"
  # 鼠标悬停在分类按钮上显示
  category-tooltip: "{name}　{description}"
  picker-cancel: "取消"
  picker-cancel-tooltip: "关闭窗口，什么都不提交"

  # ---- 第二步：填内容（两步式） ----
  # {name} 分类名
  form-title: "{name}"
  form-body: "{name}　{description}"
  # ---- 单页式（dialog.two-step: false）用这两条 ----
  title: "提交反馈"
  body: "选择反馈分类，填写标题与内容，点击「提交」即可送达服务器管理员。"
  category-label: "反馈分类"
  category-option: "{name} - {description}"
  title-label: "标题"
  title-hint: "一句话描述问题"
  body-label: "详细内容"
  body-hint: "补充复现步骤、时间、报错信息等"
  icon-label: "游戏内反馈"
  confirm: "提交"
  confirm-tooltip: "发送给服务器管理员"
  back: "返回"
  back-tooltip: "回到上一步重新选择分类"
  cancel: "取消"
  cancel-tooltip: "放弃本次提交"
  unsupported: "&c当前服务端不支持对话框功能，请用 &f/iusse submit <分类> <标题>|<内容> &c提交。"

  # 提交时发现可能已有相同反馈，先让玩家确认一次
  duplicate-title: "可能已有相同反馈"
  duplicate-body: "已经有人提过相似的问题：\n\n#{number} {title}\n{url}\n\n如果确实是另一个问题，可以继续提交。"
  duplicate-confirm: "仍然提交"
  duplicate-confirm-tooltip: "忽略重复提示，继续创建新反馈"
  duplicate-cancel: "返回"
  duplicate-cancel-tooltip: "先去看看已有的那条反馈"

# ------------------------------------------------------------
# 提交流程
# ------------------------------------------------------------
submit:
  cooldown: "&c提交过于频繁，请 &e{seconds} &c秒后再试。"
  title-too-short: "&c标题太短了，至少 {min} 个字。"
  title-too-long: "&c标题太长了，最多 {max} 个字。"
  body-empty: "&c内容不能为空。"
  checking-duplicate: "&7正在检查是否已经有相似的反馈……"
  duplicate-found: "&e发现可能重复的反馈：&f#{number} &7{title}"
  mask-notice: "&7（检测到疑似 IP / 手机号 / 邮箱，已自动打码）"
  queue-failed: "&e已存入重发队列，稍后会自动重试，成功后另行通知你。"
  body-too-long: "&c内容太长了，最多 {max} 个字。"
  cancelled: "&7已取消本次提交。"
  submitting: "&7正在投递到各渠道，请稍候……"
  result-header-success: "&a提交成功！投递结果："
  result-line-ok: " &a▶ &f{channel} &7- {detail}"
  result-line-fail: " &c▶ &f{channel} &7- {detail}"
  all-failed: "&c所有渠道都投递失败了："
  no-channel: "&c服务器尚未配置任何反馈渠道，请联系管理员。"

# ------------------------------------------------------------
# 反馈跟踪（Issue 状态回传给提交者）
# ------------------------------------------------------------
# {title} 反馈标题，{url} Issue 地址，{comment} 最新评论内容
tracking:
  # 投递失败后由重发队列补发的结果
  notify-queued-success: "&a你之前提交的反馈已补发成功：&f{title}\n&7{url}"
  notify-queued-dropped: "&c你之前提交的反馈重试 {attempts} 次仍未送达，已放弃：&f{title}\n&7你可以稍后用 &f/iusse &7重新提交。"
  notify-closed: "&a你提交的反馈已被处理：&f{title}\n&7{url}"
  notify-comment: "&e你提交的反馈有新回复：&f{title}\n&8{comment}\n&7{url}"
  # 下面这条会发到 QQ 群 / Discord，写纯文本（渠道不认颜色代码）
  announce-closed: "[反馈已处理] #{number} {title}\n分类：{category}\n提交者：{player}\n{url}"

# ------------------------------------------------------------
# 处理超时提醒（发给管理员）
# ------------------------------------------------------------
# {hours} 阈值小时数，{number} Issue 编号，{age} 已等待小时数
sla:
  header: "&c[反馈超时] 以下反馈已提交超过 &f{hours} &c小时仍未处理："
  line: " &7#{number} &f{title} &8({category}) &7已等待 &f{age} &7小时"
  footer: "&7处理地址：&f{url}"

# ------------------------------------------------------------
# 我的反馈（/iusse mine）
# ------------------------------------------------------------
feedback:
  mine-header: "&7你提交过的反馈（显示最近 {count} 条，共 {total} 条）："
  mine-line-open: " &e#{number} &f{title} &8({category}) &7已等待 &f{age} &7小时"
  mine-line-closed: " &a#{number} &f{title} &8({category}) &7已处理"
  mine-empty: "&7你还没有提交过反馈。"
  mine-hint: "&7补充说明：&f/iusse reply <编号> <内容>"

# ------------------------------------------------------------
# 回复反馈（/iusse reply）
# ------------------------------------------------------------
reply:
  too-long: "&c回复内容太长了，最多 {max} 个字。"
  sending: "&7正在把回复发送到反馈 #{number}……"
  success: "&a已回复反馈 #{number}：&f{title}"
  failed: "&c回复失败：{detail}"
  not-found: "&c没有找到编号为 &f#{number} &c的反馈。"
  not-owner: "&c你只能回复自己提交过的反馈。"

# ------------------------------------------------------------
# 管理员：反馈列表（/iusse list）
# ------------------------------------------------------------
list:
  header: "&7待处理反馈（共 {total} 条，显示 {count} 条，等得最久的排最前）："
  line: " &e#{number} &f{title} &8({category}) &7来自 &f{player} &7已等待 &f{age} &7小时"
  line-overdue: " &c#{number} &f{title} &8({category}) &7来自 &f{player} &7&l已等待 &f{age} &7&l小时"
  line-closed: " &a#{number} &f{title} &8({category}) &7来自 &f{player} &8[已处理]"
  empty: "&7当前没有符合条件的反馈。"
  hint: "&7处理：&f/iusse close <编号> [理由]"

# ------------------------------------------------------------
# 管理员：关闭反馈（/iusse close）
# ------------------------------------------------------------
close:
  sending: "&7正在关闭反馈 #{number}……"
  success: "&a已关闭反馈 #{number}，并通知了提交者。"
  failed: "&c关闭失败：{detail}"
  not-found: "&c没有找到编号为 &f#{number} &c的反馈。"

# ------------------------------------------------------------
# 管理员：统计（/iusse stats）
# ------------------------------------------------------------
stats:
  header: "&7反馈统计（基于本地记录）："
  line-total: " &7累计提交：&f{value} &8条"
  line-open: " &7待处理：&f{value} &8条"
  line-closed: " &7已处理：&f{value} &8条"
  line-overdue: " &c已超时：&f{value} &8条"
  line-average: " &7平均处理时长：&f{value}"
  line-recent: " &7最近 7 天：&f{value} &8条"
  line-queue: " &7待重发队列：&f{value} &8条"

# ------------------------------------------------------------
# 管理员：自检（/iusse test）
# ------------------------------------------------------------
test:
  checking: "&7正在逐项检查 GitHub、各渠道与联动插件，请稍候……"
  header: "&7AQIssue 自检结果："
  ok: " &a[正常] &f{name} &7- {detail}"
  warn: " &e[注意] &f{name} &7- {detail}"
  fail: " &c[异常] &f{name} &7- {detail}"

# ------------------------------------------------------------
# 管理员：查询玩家 QQ（/iusse qq）
# ------------------------------------------------------------
qq:
  checking: "&7正在查询 &f{player} &7绑定的 QQ……"
  easybot-missing: "&cEasyBot 不可用：&f{detail}"
  easybot-not-ready: "&eEasyBot 已加载，但还没连上主程序，暂时查不到绑定。请确认 EasyBot 已在群聊里上线。"
  easybot-no-query: "&eEasyBot 已连接，但当前版本没有可用的查询接口：&7{detail}"
  unbound: "&e玩家 &f{player} &e没有绑定 QQ。"
  bound: "&a玩家 &f{player} &a绑定的 QQ：&f{qq}"
  sent: "&a测试私信已发送到 &f{qq}&a，去 QQ 上看看收到没有。"
  send-failed: "&c测试私信发送失败：{detail}"
  # /iusse at —— 在群里 @ 某玩家，用来验证 @ 链路
  at-sent: "&a已在 QQ 群里 @ &f{qq}&a，去群里看看收到没有。"
  at-failed: "&c群消息发送失败：{detail}"
  at-default-message: "服务器测试消息，收到请忽略。"

# ------------------------------------------------------------
# 连接状态 / 仓库信息
# ------------------------------------------------------------
status:
  checking: "&7正在检查各渠道……"
  header: "&7投递渠道状态："
  channel-ok: " &a[正常] &f{channel} &7- {detail}"
  channel-fail: " &c[异常] &f{channel} &7- {detail}"
  no-channel: " &7（没有任何已启用的渠道）"

repository:
  url: "&7仓库地址：&f{url}"

# ------------------------------------------------------------
# 指令反馈
# ------------------------------------------------------------
command:
  invalid-syntax: "&c参数不正确，用法：&f{usage}"
  usage:
    - "&8&m----------------&r &bAQIssue &8&m----------------"
    - "&f/iusse &7- 打开反馈对话框"
    - "&f/iusse submit <分类> <标题>|<内容> &7- 一行式提交"
    - "&f/iusse mine &7- 查看我提交过的反馈"
    - "&f/iusse reply <编号> <内容> &7- 给我的反馈补充说明"
    - "&f/iusse url &7- 查看仓库地址"
    - "&7—— 以下需要管理员权限 ——"
    - "&f/iusse list [open|closed|all] &7- 列出反馈"
    - "&f/iusse close <编号> [理由] &7- 关闭反馈并通知提交者"
    - "&f/iusse stats &7- 反馈统计"
    - "&f/iusse test &7- 逐项自检各个渠道"
    - "&f/iusse qq <玩家> [测试消息] &7- 查询玩家绑定的 QQ（可顺带发测试私信）"
    - "&f/iusse at <玩家> [消息] &7- 在 QQ 群里 @ 该玩家（验证 @ 链路）"
    - "&f/iusse status &7- 查看已启用渠道状态"
    - "&f/iusse reload &7- 重载配置"
    - "&8&m----------------------------------------"
