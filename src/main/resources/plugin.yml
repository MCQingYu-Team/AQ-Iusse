name: AQIssue
version: '${project.version}'
main: cn.aqcraft.iusse.AqIssuePlugin
api-version: '1.21'
authors: [MCQingYu-Team]
description: 在游戏内通过 Paper 对话框（Dialog）向 GitHub 仓库提交 Issue
website: https://github.com/MCQingYu-Team/AQ-Iusse

commands:
  iusse:
    description: 打开反馈对话框，或向 GitHub 仓库提交 Issue
    usage: |
      /iusse              打开反馈对话框
      /iusse submit <分类> <标题>|<内容>
      /iusse status       查看 GitHub 连接状态
      /iusse url          查看仓库地址
      /iusse reload       重载配置（管理员）
    aliases: [issue, gitissue, aqissue]
    permission: aqissue.use

permissions:
  aqissue.use:
    description: 允许使用 /iusse 打开对话框并提交反馈
    default: true
  aqissue.admin:
    description: 允许重载配置、查看连接状态
    default: op
