name: AQIssue
version: '${project.version}'
main: cn.aqcraft.iusse.AqIssuePlugin
api-version: '1.21'
authors: [MCQingYu-Team]
description: 在游戏内通过 Paper 对话框把反馈投递到 GitHub / Discord / QQ 群
website: https://github.com/MCQingYu-Team/AQ-Iusse

# 装了 EasyBot 时，可在玩家离线时查询其绑定的 QQ 并私信通知（不装也能正常用）
softdepend: [EasyBot]

commands:
  iusse:
    description: 打开反馈对话框，或直接提交一条反馈
    usage: |
      /iusse              打开反馈对话框
      /iusse submit <分类> <标题>|<内容>
      /iusse status       查看各渠道状态
      /iusse url          查看仓库地址
      /iusse reload       重载配置（管理员）
    # 别名不宜用 issue 这种过于通用的名字，容易与其它插件撞车导致命令注册失败
    aliases: [gitissue, aqissue]
    permission: aqissue.use

permissions:
  aqissue.use:
    description: 允许使用 /iusse 打开对话框并提交反馈
    default: true
  aqissue.admin:
    description: 允许重载配置、查看连接状态
    default: op
